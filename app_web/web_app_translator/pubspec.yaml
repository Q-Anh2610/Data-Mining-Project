name: flutter_application_1
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Các thư viện bạn đang sử dụng trong dự án
  connectivity_plus: ^5.0.2
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  http: ^1.6.0
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  supabase_flutter: ^2.12.0
  path: ^1.9.1
  onnxruntime: ^1.4.1
  shared_preferences: ^2.2.3
  flutter_tts: ^4.2.5
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Cấu hình đường dẫn để ứng dụng nhận diện được ảnh Logo và Model của bạn
  assets:
    - assets/images/logo.jpg
    - assets/images/earth.jpg
    - assets/images/earth2.jpg
    - assets/mobile_translator_en_vi/
    - assets/mobile_translator_vi_en/
